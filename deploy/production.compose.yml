services:
  api:
    image: ${API_IMAGE:-ghcr.io/kevo-dev/blueprint-hr-api}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    networks:
      - blueprint-hr

  web:
    image: ${WEB_IMAGE:-ghcr.io/kevo-dev/blueprint-hr-web}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:8080"
    depends_on:
      - api
    networks:
      - blueprint-hr

networks:
  blueprint-hr:
    driver: bridge
