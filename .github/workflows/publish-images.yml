name: Publish container images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      frontend_api_url:
        description: Public ASP.NET Core API origin embedded in the React bundle
        required: false
        type: string

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/blueprint-hr-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/blueprint-hr-web
  IMAGE_TAG: ${{ github.ref_name }}

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  publish:
    name: Build and publish production images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve frontend API origin
        id: config
        env:
          INPUT_API_URL: ${{ inputs.frontend_api_url }}
          REPOSITORY_API_URL: ${{ vars.FRONTEND_API_URL }}
        run: |
          api_url="${INPUT_API_URL:-$REPOSITORY_API_URL}"
          if [ -z "$api_url" ]; then
            echo "Set the FRONTEND_API_URL repository variable or provide the workflow input." >&2
            exit 1
          fi
          echo "api_url=$api_url" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate API image metadata
        id: api_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - name: Build and push API image
        id: api_push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          push: true
          tags: ${{ steps.api_meta.outputs.tags }}
          labels: ${{ steps.api_meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Generate web image metadata
        id: web_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - name: Build and push web image
        id: web_push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          build-args: |
            VITE_API_URL=${{ steps.config.outputs.api_url }}
          push: true
          tags: ${{ steps.web_meta.outputs.tags }}
          labels: ${{ steps.web_meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Attest API image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ steps.api_push.outputs.digest }}
          push-to-registry: true

      - name: Attest web image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.WEB_IMAGE }}
          subject-digest: ${{ steps.web_push.outputs.digest }}
          push-to-registry: true
