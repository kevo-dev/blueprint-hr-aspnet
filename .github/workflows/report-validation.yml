name: Validate SSRS reports

on:
  push:
    branches: [main]
    paths:
      - 'reports/**'
      - 'scripts/ssrs/**'
      - '.github/workflows/report-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'reports/**'
      - 'scripts/ssrs/**'
      - '.github/workflows/report-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdl:
    name: Validate RDL XML
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate report definitions
        shell: pwsh
        run: ./scripts/ssrs/validate-rdl.ps1
